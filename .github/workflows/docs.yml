name: Docs site

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # quartz-action always builds into the same directory, so each build is moved out
      # before the next one overwrites it.
      - id: quartz-en
        uses: raven-wing/quartz-action@main
        with:
          quartz-version: v5.0.0
          config: quartz.config.en.yaml
          content-dir: docs/en
      - name: Place English site at the root
        env:
          OUTPUT_DIR: ${{ steps.quartz-en.outputs.output-dir }}
        run: mv "$OUTPUT_DIR" "$RUNNER_TEMP/site"

      - id: quartz-pl
        uses: raven-wing/quartz-action@main
        with:
          quartz-version: v5.0.0
          config: quartz.config.pl.yaml
          content-dir: docs/pl
      - name: Place Polish site under /pl
        env:
          OUTPUT_DIR: ${{ steps.quartz-pl.outputs.output-dir }}
        run: mv "$OUTPUT_DIR" "$RUNNER_TEMP/site/pl"

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
